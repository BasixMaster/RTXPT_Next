<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">B0–B16 roadmap and B10 sampling branches</title><desc id="desc">B0 reference; native and ReSTIR development controls; B9 limited PT++; B10 full PT++ remains partial. B10.75, B10.50 and B10.25 are sampling branches. B11 compatible neighbors, B12 stochastic pairwise MIS, B13 LoD, B14 BDPT with LW, B15 guiding and B16 multilayer splatting are cumulative planned additions.</desc><rect width="1000" height="540" rx="12" fill="#f3f6fa"/><g transform="translate(15,15)"><rect width="310" height="116" rx="10" fill="#e6f2f3" stroke="#91a7b5"/><g text-anchor="middle" font-family="system-ui" fill="#20354b"><text x="155" y="30" font-size="22" font-weight="650">B0</text><text x="155" y="61" font-size="16">RTXPT 1.9 reference</text><text x="155" y="92" font-size="14">Preserved</text></g></g><g transform="translate(345,15)"><rect width="310" height="116" rx="10" fill="#e6f2f3" stroke="#91a7b5"/><g text-anchor="middle" font-family="system-ui" fill="#20354b"><text x="155" y="30" font-size="22" font-weight="650">B1–B5</text><text x="155" y="61" font-size="16">Native PT / DI / GI</text><text x="155" y="92" font-size="14">Scoped measurements</text></g></g><g transform="translate(675,15)"><rect width="310" height="116" rx="10" fill="#e6f2f3" stroke="#91a7b5"/><g text-anchor="middle" font-family="system-ui" fill="#20354b"><text x="155" y="30" font-size="22" font-weight="650">B6–B8</text><text x="155" y="61" font-size="16">ReSTIR PT / DI / GI</text><text x="155" y="92" font-size="14">Scoped development</text></g></g><g transform="translate(15,147)"><rect width="310" height="116" rx="10" fill="#e6f2f3" stroke="#91a7b5"/><g text-anchor="middle" font-family="system-ui" fill="#20354b"><text x="155" y="30" font-size="22" font-weight="650">B9</text><text x="155" y="61" font-size="16">Limited PT++</text><text x="155" y="92" font-size="14">Scoped measurements</text></g></g><g tra