<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" role="img" aria-labelledby="title desc"><title id="title">Canonical experiment groups</title><desc id="desc">B0 original reference; B1–B5 native path tracing with DI/GI; B6–B8 ReSTIR PT; B9–B10 PT++. B8 initial-GI and limited PT++ development execute; full GI reuse and B10 GPU mechanisms remain pending.</desc><g transform="translate(10,20)"><rect width="230" height="100" rx="12" fill="#e6f2f3" stroke="#809daa"/><text x="115" y="38" text-anchor="middle" font-family="system-ui" font-size="22" fill="#20354b">B0</text><text x="115" y="69" text-anchor="middle" font-family="system-ui" font-size="16" fill="#20354b">RTXPT v1.9 reference</text></g><g transform="translate(260,20)"><rect width="230" height="100" rx="12" fill="#e6f2f3" stroke="#809daa"/><text x="115" y="38" text-anchor="middle" font-family="system-ui" font-size="22" fill="#20354b">B1–B5</text><text x="115" y="69" text-anchor="middle" font-family="system-ui" font-size="16" fill="#20354b">Native PT + DI/GI</text></g><g transform="translate(510,20)"><rect width="230" height="100" rx="12" fill="#e6f2f3" stroke="#809daa"/><text x="115" y="38" text-anchor="middle" font-family="system-ui" font-size="22" fill="#20354b">B6–B8</text><text x="115" y="69" text-anchor="middle" font-family="system-ui" font-size="16" fill="#20354b">ReSTIR PT + DI/GI</text></g><g transform="translate(760,20)"><rect width="230" height="100" rx="12" fill="#fff0db" stroke="#809daa"/><text x="115" y="38" text-anchor="middle" font-family="system-ui" font-size="22" fill="#20354b">B9–B10</text><text x="115" y="69" text-anchor="middle" font-family="system-ui" font-size="16" fill="#20354b">Limited / full PT++</text></g></svg>