="#20354b"><text x="155" y="30" font-size="22" font-weight="650">B14</text><text x="155" y="61" font-size="16">ReSTIR BDPT · LW version</text><text x="155" y="92" font-size="14">Planned · adds to B13</text></g></g><g transform="translate(345,411)"><rect width="310" height="116" rx="10" fill="#edf0f5" stroke="#91a7b5"/><g text-anchor="middle" font-family="system-ui" fill="#20354b"><text x="155" y="30" font-size="22" font-weight="650">B15</text><text x="155" y="61" font-size="16">ReSTIR PG</text><text x="155" y="92" font-size="14">Planned · adds to B14</text></g></g><g transform="translate(675,411)"><rect width="310" height="116" rx="10" fill="#edf0f5" stroke="#91a7b5"/><g text-anchor="middle" font-family="system-ui" fill="#20354b"><text x="155" y="30" font-size="22" font-weight="650">B16</text><text x="155" y="61" font-size="16">Multi-layer reservoir splatting</text><text x="155" y="92" font-size="14">Planned · adds to B15</text></g></g></svg>