<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 245" role="img" aria-labelledby="title desc"><title id="title">Integration dependency map</title><desc id="desc">RTXPT1.9 is the immutable baseline. B1 migrates its existing DI/GI integration to RTXDI3.1. B2 and later extensions remain proposed. The separate SDK checkout is reference-only. Geometry LoD and BDPT have separate gates.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#446784"/></marker></defs><g font-family="system-ui" font-size="17" text-anchor="middle" fill="#20354b" stroke="#a4b7c9"><rect x="10" y="20" width="210" height="75" rx="10" fill="#d8ede7"/><rect x="270" y="20" width="210" height="75" rx="10" fill="#edf3fa"/><rect x="530" y="20" width="210" height="75" rx="10" fill="#edf3fa"/><rect x="790" y="20" width="200" height="75" rx="10" fill="#edf3fa"/><rect x="10" y="155" width="210" height="70" rx="10" fill="#edf3fa"/><rect x="270" y="155" width="210" height="70" rx="10" fill="#edf3fa"/><rect x="530" y="155" width="210" height="70" rx="10" fill="#edf3fa"/><rect x="790" y="155" width="200" height="70" rx="10" fill="#edf3fa"/></g><g font-family="system-ui" font-size="17" text-anchor="middle" fill="#20354b"><text x="115" y="49">RTXPT1.9 baseline</text><text x="115" y="76" font-size="14">Original renderer + scenes</text><text x="375" y="49">B1 · RTXDI3.1</text><text x="375" y="76" font-size="14">Runtime + adapter</text><text x="635" y="49">B2+ · Optimization</text><text x="635" y="76" font-size="14">Separate estimator gates</text><text x="890" y="49">Temporal domains</text><text x="890" y="76" font-size="14">Splat → multi-layer</text><text x="115" y="183">RTXDI3.1 reference</text><text x="115" y="207" font-size="14">Source linked only</text><text x="375" y="183">Shared validation</text><text x="375" y="207" font-size="14">Raw + reconstructed</text><text x="635" y="183">Geometry LoD</text>